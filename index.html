<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Keep the compatibility shim isolated to browser-extension errors.
      (function () {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () { return originalFetch; },
            set: function (fn) { originalFetch = fn; }
          });
        } catch (error) {
          // Ignore browsers that do not allow redefining fetch.
        }
        window.addEventListener('error', function (event) {
          if (event && event.filename && (
            event.filename.indexOf('chrome-extension://') !== -1 ||
            event.filename.indexOf('moz-extension://') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
